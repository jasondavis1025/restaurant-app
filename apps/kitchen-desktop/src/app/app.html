<h1>Cafe Samui Kitchen</h1>

@if (isLoading()) {
<p>Loading orders...</p>
} @if (error()) {
<p>{{ error() }}</p>
} @for (order of orders(); track order.id) {
<article>
  <h2>Order #{{ order.id }}</h2>
  <p>{{ order.customerName }}</p>
  <p>Status: {{ order.status }}</p>
  <p>Total: {{ order.total }}</p>
</article>
}

<p>Running on: {{ platform }}</p>
